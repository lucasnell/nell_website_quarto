# Website-only additions to the bibliographic record, keyed by citation key.
# Zotero stays the source of truth for authors, journal, volume, pages, DOI.
# This file holds what Zotero doesn't carry.
#
#   access:   open | closed        which icon links the DOI
#   pdf:      url                  adds a PDF icon
#   mentees:  [Name X, Name Y]     appends * to those authors
#   title:    string               overrides the bib title (casing, markup)
#   override: {...}                corrects a wrong or missing bib field
#
# Every key below is optional. A paper needing none can be left out entirely.
#
# The `title:` overrides exist because Better BibTeX is exporting Title Case.
# If you switch that export to sentence case in Zotero, delete them all.

