# Pins the build so local and production never drift apart.
# Bump QUARTO_VERSION deliberately, and check a deploy preview before merging.
#
# QUARTO_VERSION alone does NOT get quarto onto the build image's PATH --
# confirmed by an actual failed build (`quarto: command not found`, exit
# 127) before this plugin was added. The official Quarto Netlify plugin
# installs the pinned version and runs the render itself; don't also set
# `[build] command = "quarto render"`, or it'll run before the plugin has
# installed quarto (or double-render).
#
# Must include the "v" prefix (e.g. "v1.10.18", not "1.10.18") -- the
# plugin passes this value straight through as a literal GitHub release
# tag (quarto-dev/quarto-cli's `getReleaseByTag`), and quarto-cli's actual
# tags are "v"-prefixed. Without it, the plugin 404s in onPreBuild
# ("HttpError: Not Found") before quarto is even installed.

[build]
  publish = "_site"

[build.environment]
  QUARTO_VERSION = "v1.10.18"

[[plugins]]
  package = "@quarto/netlify-plugin-quarto"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# The old Hugo site's top-level pages all had trailing slashes
# (/research/, /publications/, /resources/, /cv/); Quarto renders these as
# flat .html files, so rewrite the old paths to keep existing links working.
# The three resources/ sub-pages don't need this: they're each an index.qmd
# inside its own directory, so they already resolve at a trailing slash.
[[redirects]]
  from = "/research/"
  to = "/research.html"
  status = 200

[[redirects]]
  from = "/publications/"
  to = "/publications.html"
  status = 200

[[redirects]]
  from = "/resources/"
  to = "/resources.html"
  status = 200

[[redirects]]
  from = "/cv/"
  to = "/cv.html"
  status = 200
